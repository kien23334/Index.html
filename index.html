<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đo Mức Độ Tình Yêu ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe6e9, #fbe3e8);
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
      text-align: center;
      width: 350px;
    }

    h2 {
      color: #ff2a5f;
      margin-bottom: 10px;
    }

    /* Khung hiển thị GIF trên đầu đồng hồ */
    .gif-box {
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .gif-box img {
      max-width: 100px;
      max-height: 100px;
      object-fit: contain;
    }

    /* Khung đồng hồ */
    .gauge-wrapper {
      position: relative;
      width: 240px;
      height: 125px;
      margin: 0 auto;
      overflow: hidden;
    }

    .gauge-bg {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: conic-gradient(
        from 270deg,
        #ff758c 0deg,
        #ff2a5f 180deg,
        transparent 180deg
      );
      position: absolute;
      top: 0;
      left: 0;
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }

    .gauge-inner {
      width: 170px;
      height: 170px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
      z-index: 2;
    }

    /* 5 Vạch chia */
    .ticks {
      position: absolute;
      width: 240px;
      height: 240px;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .tick {
      position: absolute;
      width: 3px;
      height: 14px;
      background: #ffffff;
      left: calc(50% - 1.5px);
      top: 5px;
      transform-origin: 50% 115px;
    }

    /* Kim chỉ số - Tăng thời gian transition lên 0.4s để kim trôi chậm và mượt hơn */
    .needle {
      width: 4px;
      height: 95px;
      background: #222;
      position: absolute;
      bottom: 5px;
      left: calc(50% - 2px);
      transform-origin: bottom center;
      transform: rotate(-90deg);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 4;
      border-radius: 2px;
    }

    .needle::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -6px;
      width: 16px;
      height: 16px;
      background: #ff2a5f;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    /* Số % và văn bản */
    .percentage-text {
      font-size: 30px;
      font-weight: bold;
      color: #ff2a5f;
      margin-top: 10px;
    }

    .label {
      font-size: 14px;
      color: #666;
      height: 20px;
      margin-bottom: 20px;
    }

    /* Thanh trượt */
    .slider {
      -webkit-appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #ffd3dc;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ff2a5f;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 42, 95, 0.4);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Mức Độ Tình Yêu ❤️</h2>

    <!-- GIF hiển thị TRÊN ĐẦU đồng hồ -->
    <div class="gif-box">
      <img id="loveGif" src="https://res.cloudinary.com/raqf0kpz/image/upload/v1785232816/微博_pqxamp.gif" alt="GIF cảm xúc">
    </div>

    <!-- Đồng hồ tốc độ -->
    <div class="gauge-wrapper">
      <div class="gauge-bg"></div>
      
      <!-- 5 vạch chia -->
      <div class="ticks">
        <div class="tick" style="transform: rotate(-90deg);"></div>
        <div class="tick" style="transform: rotate(-45deg);"></div>
        <div class="tick" style="transform: rotate(0deg);"></div>
        <div class="tick" style="transform: rotate(45deg);"></div>
        <div class="tick" style="transform: rotate(90deg);"></div>
      </div>

      <div class="gauge-inner"></div>
      <div class="needle" id="needle"></div>
    </div>

    <!-- Số % & Trạng thái -->
    <div class="percentage-text" id="loveText">0%</div>
    <div class="label" id="statusText">Chưa có tín hiệu...</div>

    <!-- Thanh trượt -->
    <div class="slider-container">
      <input type="range" min="0" max="100" value="0" class="slider" id="loveSlider">
      <div class="range-labels">
        <span>0%</span>
        <span>25%</span>
        <span>50%</span>
        <span>75%</span>
        <span>100%</span>
      </div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('loveSlider');
    const needle = document.getElementById('needle');
    const loveText = document.getElementById('loveText');
    const statusText = document.getElementById('statusText');
    const loveGif = document.getElementById('loveGif');

    const gifList = [
      "https://res.cloudinary.com/raqf0kpz/image/upload/v1785232816/微博_pqxamp.gif",
      "https://res.cloudinary.com/raqf0kpz/image/upload/v1785232833/Bubu_Dudu_Crying_GIF_-_Bubu_dudu_Crying_-_Discover_Share_GIFs_ykt2f0.gif",
      "https://res.cloudinary.com/raqf0kpz/image/upload/v1785232851/c491b9f2-9ef7-4870-8734-819c19dba127_t26bal.gif",
      "https://res.cloudinary.com/raqf0kpz/image/upload/v1785232875/bbed95e9-5cd9-4a89-864e-7c0be168c694_o61rm5.gif",
      "https://res.cloudinary.com/raqf0kpz/image/upload/v1785232888/5d02d7a7-d98e-4263-9e8f-ba29b9ddf0e9_iysmjo.gif"
    ];

    slider.addEventListener('input', function() {
      const val = parseInt(this.value);

      // Hiển thị %
      loveText.innerText = val + '%';

      // Xoay kim với hiệu ứng quán tính chậm rãi
      const angle = (val / 100) * 180 - 90;
      needle.style.transform = `rotate(${angle}deg)`;

      // Đổi GIF & câu chữ theo mốc %
      let selectedGif = gifList[0];
      
      if (val === 0) {
        statusText.innerText = "Chưa có tín hiệu...";
        selectedGif = gifList[0];
      } else if (val <= 25) {
        statusText.innerText = "Hơi giận dỗi/Buồn nhẹ 🥺";
        selectedGif = gifList[1];
      } else if (val <= 50) {
        statusText.innerText = "Thương thương rồi đó 🥰";
        selectedGif = gifList[2];
      } else if (val <= 75) {
        statusText.innerText = "Yêu đậm sâu lắm rồi! 🔥";
        selectedGif = gifList[3];
      } else {
        statusText.innerText = "Tối đa công suất! Yêu 1000% ❤️🚀";
        selectedGif = gifList[4];
      }

      if (loveGif.src !== selectedGif) {
        loveGif.src = selectedGif;
      }
    });
  </script>

</body>
</html>
